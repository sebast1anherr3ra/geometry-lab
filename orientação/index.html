<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superfície torcida e vetores normais — Geometric Lab</title>
<style>
:root{color-scheme:dark;--bg:#08111f;--panel:#101d30;--line:#263a55;--text:#eaf2ff;--muted:#a8bad2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#12243a,#08111f 60%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:18px 22px 10px;max-width:1400px;margin:auto}
h1{font-size:clamp(1.25rem,3vw,1.8rem);margin:0 0 5px}
p{margin:4px 0;color:var(--muted)}
main{max-width:1400px;margin:auto;padding:10px 18px 24px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
#view{height:min(74vh,760px);min-height:420px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#07101c;position:relative}
#view canvas{display:block;width:100%;height:100%}
.panel{background:rgba(16,29,48,.92);border:1px solid var(--line);border-radius:16px;padding:15px;height:max-content}
.control{margin:0 0 18px}.control label{display:flex;justify-content:space-between;gap:10px;font-weight:600;margin-bottom:7px}
input[type=range]{width:100%;accent-color:#77b9ff}
button{font:inherit;color:var(--text);background:#1b304b;border:1px solid #365171;border-radius:9px;padding:9px 10px;cursor:pointer}
button:hover{background:#294665}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.toggle{display:flex;gap:8px;align-items:center;margin:9px 0;color:var(--muted)}
.toggle input{accent-color:#77b9ff}
.note{font-size:.88rem;color:var(--muted);margin-top:14px}
#status{font-size:.84rem;color:#a9d5ff;margin-top:10px}
@media(max-width:850px){main{grid-template-columns:1fr}#view{height:58vh;min-height:360px}.panel{order:2}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<header>
<h1>Superfície torcida e seus vetores normais</h1>
<p>Varie o número de torções e a quantidade de vetores normais sobre a curva central.</p>
</header>
<main>
<div id="view" aria-label="Visualização tridimensional interativa"></div>
<aside class="panel">
<div class="control">
<label for="twists"><span>Número de torções (a)</span><output id="twout">2</output></label>
<input id="twists" type="range" min="1" max="5" step="1" value="2">
</div>
<div class="control">
<label for="vectors"><span>Número de vetores normais</span><output id="vecout">5</output></label>
<input id="vectors" type="range" min="1" max="100" step="1" value="5">
</div>
<div class="control">
<label for="opacity"><span>Opacidade da superfície</span><output id="opout">0.80</output></label>
<input id="opacity" type="range" min="0.1" max="1" step="0.05" value="0.8">
</div>
<div class="toggle"><input id="showSurface" type="checkbox" checked><label for="showSurface">Mostrar superfície</label></div>
<div class="toggle"><input id="showCurve" type="checkbox" checked><label for="showCurve">Mostrar curva central</label></div>
<div class="toggle"><input id="showNormals" type="checkbox" checked><label for="showNormals">Mostrar vetores normais</label></div>
<div class="toggle"><input id="showGrid" type="checkbox"><label for="showGrid">Mostrar grade</label></div>
<div class="buttons">
<button id="reset">Resetar câmera</button>
<button id="autorotate" aria-pressed="false">Iniciar rotação</button>
<button id="newtab">Abrir em nova aba</button>
<button id="fullscreen">Tela cheia</button>
</div>
<div id="status">Arraste para girar; use a roda do mouse para zoom.</div>
<div class="note">
<strong>Parametrização</strong><br>
x = cos(u)(2 + v sin(au/2))<br>
y = sin(u)(2 + v sin(au/2))<br>
z = v cos(au/2)<br>
−π ≤ u ≤ π, −1 ≤ v ≤ 1.
</div>
</aside>
</main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const root=document.getElementById('view');
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x07101c);
const camera=new THREE.PerspectiveCamera(43,1,.01,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.07;
controls.autoRotate=false;controls.autoRotateSpeed=1.3;
const initialPos=new THREE.Vector3(5.7,6.3,5.5);
function resetCamera(){camera.position.copy(initialPos);controls.target.set(0,0,0);controls.update();}
resetCamera();

scene.add(new THREE.HemisphereLight(0xd9ecff,0x233148,2));
const light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(5,7,8);scene.add(light);
const surfaceGroup=new THREE.Group();scene.add(surfaceGroup);
const normalGroup=new THREE.Group();scene.add(normalGroup);
const surfaceMat=new THREE.MeshStandardMaterial({color:0x6ee7ee,side:THREE.DoubleSide,transparent:true,opacity:.8,roughness:.62,metalness:.02});
const curveMat=new THREE.LineBasicMaterial({color:0x367cff});
const normalMat=new THREE.LineBasicMaterial({color:0xff454f});
const tipMat=new THREE.MeshStandardMaterial({color:0xff454f,emissive:0x501015});
const tipGeo=new THREE.SphereGeometry(.025,8,6);
let surfaceMesh=null,centerCurve=null;

function pos(u,v,a){
 const radial=2+v*Math.sin(a*u/2);
 return new THREE.Vector3(Math.cos(u)*radial,Math.sin(u)*radial,v*Math.cos(a*u/2));
}
function derivU(u,v,a){
 const s=Math.sin(a*u/2),c=Math.cos(a*u/2),radial=2+v*s;
 return new THREE.Vector3(-Math.sin(u)*radial+Math.cos(u)*v*(a/2)*c,
  Math.cos(u)*radial+Math.sin(u)*v*(a/2)*c,-v*(a/2)*s);
}
function derivV(u,a){
 return new THREE.Vector3(Math.cos(u)*Math.sin(a*u/2),Math.sin(u)*Math.sin(a*u/2),Math.cos(a*u/2));
}
function unitNormal(u,v,a){
 const n=derivU(u,v,a).cross(derivV(u,a));
 const len=n.length();
 return len>1e-10?n.multiplyScalar(1/len):new THREE.Vector3(0,0,1);
}
function disposeObject(obj){
 obj.traverse(o=>{
  if(o.geometry)o.geometry.dispose();
  if(o.material){if(Array.isArray(o.material))o.material.forEach(m=>m.dispose());else o.material.dispose();}
 });
}
function clearGroup(g){while(g.children.length){const o=g.children[0];g.remove(o);disposeObject(o);}}
function buildSurface(a){
 if(surfaceMesh){surfaceGroup.remove(surfaceMesh);disposeObject(surfaceMesh);surfaceMesh=null;}
 if(centerCurve){surfaceGroup.remove(centerCurve);disposeObject(centerCurve);centerCurve=null;}
 const nu=240,nv=48,verts=[],indices=[];
 for(let i=0;i<=nu;i++){
  const u=-Math.PI+2*Math.PI*i/nu;
  for(let j=0;j<=nv;j++){
   const v=-1+2*j/nv,p=pos(u,v,a);verts.push(p.x,p.y,p.z);
  }
 }
 for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
  const p=i*(nv+1)+j,q=(i+1)*(nv+1)+j;
  indices.push(p,q,p+1,q,q+1,p+1);
 }
 const geo=new THREE.BufferGeometry();
 geo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
 geo.setIndex(indices);geo.computeVertexNormals();
 surfaceMesh=new THREE.Mesh(geo,surfaceMat);surfaceGroup.add(surfaceMesh);
 const pts=[];for(let i=0;i<=1000;i++)pts.push(pos(-Math.PI+2*Math.PI*i/1000,0,a));
 centerCurve=new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),curveMat);
 surfaceGroup.add(centerCurve);
}
function buildNormals(a,count){
 clearGroup(normalGroup);
 for(let i=0;i<count;i++){
  const u=count===1?0:-Math.PI+2*Math.PI*i/count;
  const base=pos(u,0,a),n=unitNormal(u,0,a),tip=base.clone().addScaledVector(n,.5);
  const line=new THREE.Line(new THREE.BufferGeometry().setFromPoints([base,tip]),normalMat);
  normalGroup.add(line);
  const sphere=new THREE.Mesh(tipGeo,tipMat);sphere.position.copy(tip);normalGroup.add(sphere);
 }
}
function update(){
 const a=+$('twists').value,count=+$('vectors').value;
 $('twout').textContent=a;$('vecout').textContent=count;$('opout').textContent=(+$('opacity').value).toFixed(2);
 surfaceMat.opacity=+$('opacity').value;
 buildSurface(a);buildNormals(a,count);
 surfaceMesh.visible=$('showSurface').checked;
 centerCurve.visible=$('showCurve').checked;
 normalGroup.visible=$('showNormals').checked;
}
const $=id=>document.getElementById(id);
['twists','vectors','opacity'].forEach(id=>$(id).addEventListener('input',update));
['showSurface','showCurve','showNormals'].forEach(id=>$(id).addEventListener('change',update));
$('showGrid').addEventListener('change',()=>{
 grid.visible=$('showGrid').checked;
});
const grid=new THREE.GridHelper(8,16,0x4c6688,0x263a55);grid.position.z=-1.3;scene.add(grid);grid.visible=false;
const axes=new THREE.AxesHelper(1.5);scene.add(axes);
$('reset').addEventListener('click',resetCamera);
$('autorotate').addEventListener('click',()=>{
 controls.autoRotate=!controls.autoRotate;
 $('autorotate').textContent=controls.autoRotate?'Parar rotação':'Iniciar rotação';
 $('autorotate').setAttribute('aria-pressed',String(controls.autoRotate));
});
$('newtab').addEventListener('click',()=>window.open(window.location.href,'_blank','noopener'));
$('fullscreen').addEventListener('click',async()=>{
 try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();}
 catch(e){$('status').textContent='Tela cheia indisponível neste contexto; tente abrir em nova aba.';}
});
function resize(){const w=Math.max(1,root.clientWidth),h=Math.max(1,root.clientHeight);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false);}
new ResizeObserver(resize).observe(root);resize();update();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);}
animate();
</script>
</body>
</html>
