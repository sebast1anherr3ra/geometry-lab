*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:#10151e;color:#eef3fa;font-family:system-ui,sans-serif}body{height:100vh;height:100dvh}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.controls{position:absolute;left:14px;right:14px;bottom:14px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 14px;background:#0d131de8;border:1px solid #35445b;border-radius:14px}.controls label{font-size:12px;color:#dce5f2}input[type=range]{width:130px;accent-color:#66d9ef}select,button{background:#202d40;color:#eef3fa;border:1px solid #50617a;border-radius:8px;padding:8px}button{cursor:pointer;font-weight:600}output{font-size:12px;color:#f0d59a}.fullscreen-toggle{position:fixed;z-index:20;top:14px;right:14px;display:flex;align-items:center;gap:7px;background:#202d40eF;border:1px solid #647895;box-shadow:0 3px 14px #0005;padding:9px 12px}.fullscreen-toggle:focus-visible{outline:2px solid #66d9ef;outline-offset:2px}body:fullscreen{width:100%;height:100%;background:#10151e}body:fullscreen .fullscreen-toggle{top:12px;right:12px}

</style></head><body><canvas id="view"></canvas><button id="fullscreen" class="fullscreen-toggle" type="button" aria-label="Ativar tela inteira" title="Ativar tela inteira"><span aria-hidden="true">⛶</span><span id="fullscreenText">Tela inteira</span></button><div class="controls"><label for="curve">Curva</label><select id="curve"><option value="latitude">Círculo de latitude</option><option value="great">Grande círculo</option><option value="wavy">Círculo ondulado</option><option value="rhumb">Curva fechada com autointerseção</option></select><label id="paramlabel" for="shape">Latitude</label><input id="shape" type="range" min="-0.85" max="0.85" step="0.01" value="0.25"><output id="shapeval">0.25</output><label for="zoom">Zoom</label><input id="zoom" type="range" min="2" max="20" step="0.1" value="7.8"><output id="zoomval">7.8</output><button id="reset">Recentrar</button><button id="spin">Giro automático</button></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const fullscreenButton=document.querySelector('#fullscreen');
const fullscreenText=document.querySelector('#fullscreenText');
function updateFullscreenButton(){
  const active=!!document.fullscreenElement;
  fullscreenText.textContent=active?'Sair da tela inteira':'Tela inteira';
  fullscreenButton.setAttribute('aria-label',active?'Sair da tela inteira':'Ativar tela inteira');
  fullscreenButton.title=active?'Sair da tela inteira':'Ativar tela inteira';
  // Recalcula o tamanho do renderizador após a mudança de modo.
  resizeRenderer();
}
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement){await document.exitFullscreen();}
    else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen();}
    else {alert('A tela inteira não é suportada neste navegador. Abra a visualização diretamente no navegador e tente novamente.');}
  }catch(err){
    alert('O navegador ou a incorporação bloqueou a tela inteira. Abra a visualização diretamente pelo endereço do Geometric Lab e tente novamente.');
  }
}
fullscreenButton.addEventListener('click',toggleFullscreen);
document.addEventListener('fullscreenchange',updateFullscreenButton);
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#view'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
const scene=new THREE.Scene();scene.background=new THREE.Color('#10151e');const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.01,100);camera.position.set(4.3,3,5.8);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,0,0);controls.minDistance=2;controls.maxDistance=20;scene.add(new THREE.HemisphereLight(0xcdeaff,0x182338,2));let l=new THREE.DirectionalLight(0xffffff,3);l.position.set(4,5,5);scene.add(l);l=new THREE.DirectionalLight(0x52d9ff,2.4);l.position.set(-5,1,2);scene.add(l);l=new THREE.DirectionalLight(0xffc66d,2.2);l.position.set(0,4,-5);scene.add(l);
const group=new THREE.Group();scene.add(group);const mat=new THREE.MeshStandardMaterial({color:0x4fcbe7,metalness:.4,roughness:.28,side:THREE.DoubleSide,transparent:true,opacity:.93});const gold=new THREE.MeshStandardMaterial({color:0xffcf72,metalness:.65,roughness:.22});let surface=null,fibre=null,baseCurve=null,baseSphere=null,hopfPoint=null;
function curvePoint(type,t,p){if(type==='latitude'){let r=Math.cos(p),z=Math.sin(p);return new THREE.Vector3(r*Math.cos(t),z,r*Math.sin(t));}if(type==='great'){// p is the inclination angle of the plane of the great circle
return new THREE.Vector3(Math.cos(t),Math.sin(t)*Math.cos(p),Math.sin(t)*Math.sin(p));}if(type==='rhumb'){// parametrização solicitada: curva fechada na esfera
return new THREE.Vector3(Math.cos(t)*Math.cos(2*t),Math.cos(t)*Math.sin(2*t),Math.sin(t));}let waves=Math.max(1,Math.round(p)),z=.42*Math.sin(waves*t+.35),r=Math.sqrt(1-z*z);return new THREE.Vector3(r*Math.cos(t),z,r*Math.sin(t));}
function build(){const type=document.querySelector('#curve').value,p=+document.querySelector('#shape').value;for(const o of [surface,fibre,baseCurve,baseSphere,hopfPoint])if(o){if(o.parent)o.parent.remove(o);o.traverse?.(x=>{x.geometry?.dispose()});o.geometry?.dispose();}const NU=220,NV=90,positions=[],uv=[],indices=[];
for(let i=0;i<=NU;i++){let t=2*Math.PI*i/NU,q=curvePoint(type,t,p),a=Math.sqrt(Math.max(0,(1+q.y)/2)),b=Math.sqrt(Math.max(0,(1-q.y)/2)),phase=Math.atan2(q.z,q.x);for(let j=0;j<=NV;j++){let v=2*Math.PI*j/NV,X=a*Math.cos(v),Y=a*Math.sin(v),Z=b*Math.cos(v-phase),W=b*Math.sin(v-phase),d=Math.max(1-W,.055);positions.push(2.0*X/d,2.0*Z/d,2.0*Y/d);uv.push(i/NU,j/NV);}}
for(let i=0;i<NU;i++)for(let j=0;j<NV;j++){let a=i*(NV+1)+j,b=a+NV+1;indices.push(a,a+1,b,a+1,b+1,b);}const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(indices);geo.computeVertexNormals();surface=new THREE.Mesh(geo,mat);group.add(surface);
const q=curvePoint(type,.7,p),a=Math.sqrt(Math.max(0,(1+q.y)/2)),b=Math.sqrt(Math.max(0,(1-q.y)/2)),phase=Math.atan2(q.z,q.x),pts=[];for(let k=0;k<=360;k++){let v=2*Math.PI*k/360,X=a*Math.cos(v),Y=a*Math.sin(v),Z=b*Math.cos(v-phase),W=b*Math.sin(v-phase),d=Math.max(1-W,.055);pts.push(new THREE.Vector3(2*X/d,2*Z/d,2*Y/d));}fibre=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),360,.018,8,false),gold);group.add(fibre);
baseSphere=new THREE.Mesh(new THREE.SphereGeometry(.58,36,24),new THREE.MeshStandardMaterial({color:0x7c91b1,wireframe:true,transparent:true,opacity:.2}));baseSphere.position.set(4.8,1.4,0);scene.add(baseSphere);let cpts=[];for(let k=0;k<=360;k++){let q=curvePoint(type,2*Math.PI*k/360,p);cpts.push(new THREE.Vector3(4.8+.60*q.x,1.4+.60*q.y,.60*q.z));}baseCurve=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(cpts),360,.02,8,false),gold);scene.add(baseCurve);
 // Hopf image of the stereographic projection pole N=(0,0,0,1).
 // With the current Hopf-coordinate convention this is the south pole (0,-1,0) of S².
 hopfPoint=new THREE.Group();
 const halo=new THREE.Mesh(new THREE.SphereGeometry(.085,20,16),new THREE.MeshBasicMaterial({color:0xff4f83,transparent:true,opacity:.22}));
 const marker=new THREE.Mesh(new THREE.SphereGeometry(.052,20,16),new THREE.MeshBasicMaterial({color:0xff4f83}));
 hopfPoint.position.set(4.8,1.4-.60,0);hopfPoint.add(halo,marker);scene.add(hopfPoint);
}
const shape=document.querySelector('#shape'), curve=document.querySelector('#curve');function syncLabel(){const type=curve.value;const label=document.querySelector('#paramlabel');label.textContent=type==='latitude'?'Latitude':type==='great'?'Ângulo do plano':type==='wavy'?'Número de ondulações':type==='rhumb'?'':'Forma';label.style.display=type==='rhumb'?'none':'';shape.style.display=type==='rhumb'?'none':'';document.querySelector('#shapeval').style.display=type==='rhumb'?'none':'';if(type==='great'){shape.min='0';shape.max='6.28';shape.step='.01';shape.value='.8';}else if(type==='latitude'){shape.min='-.85';shape.max='.85';shape.step='.01';shape.value='.25';}else if(type==='wavy'){shape.min='1';shape.max='12';shape.step='1';shape.value='3';}else if(type==='rhumb'){shape.min='0.05';shape.max='2';shape.step='0.05';shape.value='0.5';}else{shape.min='0';shape.max='1';shape.step='.01';shape.value='.5';}document.querySelector('#shapeval').value=(type==='wavy')?String(Math.round(+shape.value)):(+shape.value).toFixed(2);build();}curve.addEventListener('change',syncLabel);shape.addEventListener('input',()=>{document.querySelector('#shapeval').value=(curve.value==='wavy'||curve.value==='rhumb')?String(Math.round(+shape.value)):(+shape.value).toFixed(2);build();});document.querySelector('#zoom').addEventListener('input',e=>{let d=+e.target.value,dir=camera.position.clone().sub(controls.target).normalize();camera.position.copy(controls.target).addScaledVector(dir,d);controls.update();document.querySelector('#zoomval').value=d.toFixed(1);});document.querySelector('#reset').addEventListener('click',()=>{camera.position.set(4.3,3,5.8);controls.target.set(0,0,0);controls.update();let d=camera.position.distanceTo(controls.target);document.querySelector('#zoom').value=d;document.querySelector('#zoomval').value=d.toFixed(1);});let spin=false;document.querySelector('#spin').addEventListener('click',e=>{spin=!spin;e.target.textContent=spin?'Parar giro':'Giro automático';});build();function animate(){requestAnimationFrame(animate);if(spin)group.rotation.y+=.003;controls.update();renderer.render(scene,camera);}animate();function resizeRenderer(){if(!renderer)return;const w=window.innerWidth,h=window.innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);}addEventListener('resize',resizeRenderer);
</script></body></html>
